<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/aishi-remove.png" />
    <link rel="apple-touch-icon" href="/aishi-remove.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Aishi Technologies" />
    <meta name="theme-color" content="#02050f" />

    <!--
      Per-page title, description, canonical, robots, Open Graph, Twitter, and
      page-specific JSON-LD are rendered into each route's static HTML by the
      Seo component (see src/components/ui/Seo.tsx). Every route sets its own
      document title there, so none is defined here (it would be a duplicate).
      Only the site-wide entity/site structured data lives below.
    -->

    <!-- Structured data: LocalBusiness / Organization (name, logo, contact, area served) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://www.aishitech.online/#business",
        "name": "Aishi Technologies",
        "alternateName": ["Aishi Tech", "aishitech"],
        "url": "https://www.aishitech.online/",
        "logo": "https://www.aishitech.online/Aishi.png",
        "image": "https://www.aishitech.online/Aishi.png",
        "description": "Aishi Technologies builds custom websites, web & mobile apps, e-commerce stores, AI automation, and IoT systems for businesses, schools, and shops.",
        "email": "hello.aishitech@gmail.com",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Karnataka",
          "addressCountry": "IN"
        },
        "areaServed": "IN",
        "sameAs": [
          "https://www.instagram.com/aishitech/",
          "https://wa.me/918105369922"
        ]
      }
    </script>

    <!-- Structured data: Website (enables the sitename + search box) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Aishi Technologies",
        "alternateName": "Aishi Tech",
        "url": "https://www.aishitech.online/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
